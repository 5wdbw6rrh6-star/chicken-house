<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>نظام المطعم - كاشير وفواتير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e8ecef; --surface:#ffffff; --ink:#16202a; --muted:#5d6b78; --line:#d3dae0;
  --primary:#1c6b57; --primary-ink:#ffffff; --accent:#f0b429; --danger:#b3261e;
  --paper:#fbfcfa; --soft:#f2f5f7;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10161b; --surface:#19222a; --ink:#e8eef2; --muted:#9aa9b5; --line:#2b3842;
    --primary:#3fb593; --primary-ink:#06241c; --accent:#f0b429; --danger:#ff8a80;
    --paper:#202a32; --soft:#212c35;
  }
}
:root[data-theme="dark"]{
  --bg:#10161b; --surface:#19222a; --ink:#e8eef2; --muted:#9aa9b5; --line:#2b3842;
  --primary:#3fb593; --primary-ink:#06241c; --accent:#f0b429; --danger:#ff8a80;
  --paper:#202a32; --soft:#212c35;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,"Segoe UI",sans-serif;font-size:15px;line-height:1.6}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.brand{font-family:"Reem Kufi",Cairo,sans-serif;font-size:24px;font-weight:700;margin:0;color:var(--primary)}
.status{font-size:13px;font-weight:600;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.status::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor}
.status.on{color:var(--primary)}
.status.off{color:var(--danger)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--line);background:var(--soft);padding:6px 16px;border-radius:999px;font-weight:600}
.tabs button[aria-selected="true"]{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}

.app{max-width:1200px;margin:0 auto;padding:20px}

/* POS */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:22px;align-items:start}
@media (max-width:880px){.pos{grid-template-columns:1fr}}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.search{flex:1;min-width:160px;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 12px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:10px}
.dish{display:flex;flex-direction:column;justify-content:space-between;gap:10px;min-height:92px;text-align:right;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}
.dish:hover{border-color:var(--primary)}
.dish:active{transform:scale(.97)}
.dish b{font-weight:700;line-height:1.3}
.dish span{color:var(--primary);font-weight:700}
.dish small{color:var(--muted);font-size:12px}
.empty{color:var(--muted);padding:18px 4px}

/* ticket (invoice being built) */
.ticket{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:6px 6px 0 0;padding:18px 18px 22px;margin-bottom:16px;position:sticky;top:calc(70px + env(safe-area-inset-top,0px))}
@media (max-width:880px){.ticket{position:relative;top:auto}}
.ticket::after{content:"";position:absolute;inset-inline:-1px;bottom:-12px;height:12px;
  background:linear-gradient(135deg,var(--paper) 25%,transparent 25%) -6px 0,linear-gradient(225deg,var(--paper) 25%,transparent 25%) -6px 0;
  background-size:12px 12px}
.ticket h2{font-family:"Reem Kufi",Cairo,sans-serif;margin:0;font-size:22px}
.t-head{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:2px dashed var(--line);padding-bottom:10px;margin-bottom:6px}
.t-head .no{color:var(--muted);font-weight:600}
.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;min-width:0}
.row2{display:flex;gap:8px;margin:8px 0}
.lines{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto}
.line{display:grid;grid-template-columns:1fr auto 74px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.line small{display:block;color:var(--muted);font-size:12px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--surface);line-height:1;font-weight:700}
.qty span{min-width:18px;text-align:center;font-weight:700}
.ln-total{text-align:left;font-weight:700}
.sum{margin-top:10px}
.sum .r{display:flex;justify-content:space-between;padding:2px 0;color:var(--muted)}
.sum .grand{display:flex;justify-content:space-between;align-items:baseline;border-top:2px dashed var(--line);margin-top:8px;padding-top:8px;color:var(--ink)}
.grand strong{font-family:"Reem Kufi",Cairo,sans-serif;font-size:30px;color:var(--primary)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 16px;font-weight:700}
.btn.primary{background:var(--primary);color:var(--primary-ink);border-color:var(--primary)}
.btn.danger{color:var(--danger)}
.btn.sm{padding:2px 10px;font-size:13px;border-radius:8px}
.actions{display:flex;gap:8px;margin-top:14px}
.actions .primary{flex:1;font-size:17px;padding:11px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}
.panel h2{margin:0 0 12px;font-size:18px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:18px;overflow:hidden}
.strip div{padding:14px 18px}
.strip div+div{border-inline-start:1px solid var(--line)}
.strip small{color:var(--muted);display:block}
.strip b{font-family:"Reem Kufi",Cairo,sans-serif;font-size:26px}
.in-c{color:var(--primary)} .out-c{color:var(--danger)}
@media (max-width:560px){.strip{grid-template-columns:1fr}.strip div+div{border-inline-start:0;border-top:1px solid var(--line)}}
.form{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.form .field{width:auto;flex:1;min-width:130px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:13px}
.badge{display:inline-block;padding:0 10px;border-radius:999px;font-size:13px;font-weight:700;border:1px solid currentColor}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.settings label{display:flex;flex-direction:column;gap:4px;font-weight:600}

/* modal + receipt */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.modal-box{background:var(--surface);border-radius:12px;max-width:380px;width:100%;max-height:92vh;overflow:auto;padding:14px}
.modal-box .actions{margin-top:12px}
.rcpt{background:#fff;color:#111;max-width:320px;margin:0 auto;padding:14px;font-size:13px;line-height:1.5;font-family:Cairo,Tahoma,sans-serif}
.rcpt h2{margin:0;text-align:center;font-size:20px;font-family:"Reem Kufi",Cairo,sans-serif}
.rcpt .c{text-align:center;margin:2px 0}
.rcpt hr{border:0;border-top:1px dashed #444;margin:8px 0}
.rcpt .m{display:flex;justify-content:space-between}
.rcpt table{width:100%;font-size:12.5px}
.rcpt th,.rcpt td{padding:2px 0;border:0;color:#111;font-size:12.5px}
.rcpt td:last-child,.rcpt th:last-child{text-align:left}
.rcpt .t{display:flex;justify-content:space-between}
.rcpt .g{font-weight:700;font-size:17px}
.rpt{font-family:Cairo,Tahoma,sans-serif;color:#111;background:#fff}
.rpt table th,.rpt table td{color:#111;border-bottom:1px solid #bbb;white-space:normal}

#toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-weight:600;z-index:30;max-width:90%;text-align:center}
#printArea{display:none}
@media print{
  body{background:#fff}
  .top,.app,.modal,#toast{display:none!important}
  #printArea{display:block}
  :root{padding:0}
  @page{margin:8mm}
}
</style>
</head>
<body>
<header class="top">
  <h1 class="brand" id="brandName">نظام المطعم</h1>
  <span class="status off" id="status" role="status">جاري الاتصال...</span>
  <nav class="tabs" role="tablist" aria-label="الأقسام">
    <button role="tab" data-tab="pos" aria-selected="true">الكاشير</button>
    <button role="tab" data-tab="ledger" aria-selected="false">الداخل والخارج</button>
    <button role="tab" data-tab="menu" aria-selected="false">الأصناف والإعدادات</button>
  </nav>
</header>

<main class="app">
  <!-- الكاشير -->
  <section id="tab-pos" class="pos">
    <div>
      <div class="tools">
        <input class="search" id="search" type="search" placeholder="ابحث عن صنف" aria-label="بحث عن صنف">
      </div>
      <div class="chips tools" id="chips" role="group" aria-label="التصنيفات"></div>
      <div class="menu-grid" id="menuGrid"></div>
    </div>

    <aside class="ticket" aria-label="الفاتورة الحالية">
      <div class="t-head">
        <h2>الفاتورة</h2>
        <span class="no">رقم <span class="num" id="nextNo"></span></span>
      </div>
      <div class="row2">
        <input class="field" id="table" placeholder="رقم الطاولة (اختياري)" aria-label="رقم الطاولة">
        <select class="field" id="pay" aria-label="طريقة الدفع">
          <option value="cash">نقدي</option>
          <option value="card">فيزا</option>
          <option value="wallet">محفظة إلكترونية</option>
        </select>
      </div>
      <ul class="lines" id="lines"></ul>
      <div class="row2">
        <input class="field num" id="discVal" type="number" min="0" step="any" inputmode="decimal" placeholder="الخصم" aria-label="قيمة الخصم">
        <select class="field" id="discType" aria-label="نوع الخصم">
          <option value="pct">%</option>
          <option value="amt">جنيه</option>
        </select>
      </div>
      <div class="sum" id="sum"></div>
      <div class="actions">
        <button class="btn" id="clearCart">مسح</button>
        <button class="btn primary" id="checkout">حفظ وطباعة الفاتورة</button>
      </div>
    </aside>
  </section>

  <!-- الداخل والخارج -->
  <section id="tab-ledger" hidden>
    <div class="tools">
      <select class="field" id="period" style="width:auto" aria-label="الفترة">
        <option value="today">اليوم</option>
        <option value="week">آخر 7 أيام</option>
        <option value="month">هذا الشهر</option>
        <option value="all">الكل</option>
      </select>
      <button class="btn" id="printReport">طباعة التقرير</button>
    </div>
    <div class="strip" id="strip"></div>
    <div class="panel">
      <h2>تسجيل حركة يدوية</h2>
      <div class="form">
        <select class="field" id="eType" aria-label="نوع الحركة">
          <option value="out">خارج (مصروف)</option>
          <option value="in">داخل (إيراد آخر)</option>
        </select>
        <input class="field" id="eDesc" placeholder="البيان (مثال: فاتورة كهرباء)" aria-label="البيان">
        <input class="field num" id="eAmt" type="number" min="0" step="any" inputmode="decimal" placeholder="المبلغ" aria-label="المبلغ">
        <button class="btn primary" id="addEntry">إضافة</button>
      </div>
    </div>
    <div class="panel">
      <h2>الحركات</h2>
      <div class="scroll"><table id="ledgerTable"></table></div>
    </div>
  </section>

  <!-- الأصناف والإعدادات -->
  <section id="tab-menu" hidden>
    <div class="panel">
      <h2>بيانات المطعم والضرائب</h2>
      <div class="settings">
        <label>اسم المطعم<input class="field" id="sName"></label>
        <label>العنوان<input class="field" id="sAddr"></label>
        <label>التليفون<input class="field" id="sPhone"></label>
        <label>ضريبة القيمة المضافة %<input class="field num" id="sTax" type="number" min="0" step="any"></label>
        <label>رسوم الخدمة %<input class="field num" id="sSvc" type="number" min="0" step="any"></label>
      </div>
      <div class="actions"><button class="btn primary" id="saveSettings">حفظ الإعدادات</button></div>
    </div>
    <div class="panel">
      <h2>إضافة صنف</h2>
      <div class="form">
        <input class="field" id="mName" placeholder="اسم الصنف" aria-label="اسم الصنف">
        <input class="field" id="mCat" list="cats" placeholder="التصنيف" aria-label="التصنيف">
        <datalist id="cats"></datalist>
        <input class="field num" id="mPrice" type="number" min="0" step="any" inputmode="decimal" placeholder="السعر" aria-label="السعر">
        <button class="btn primary" id="addDish">إضافة</button>
      </div>
    </div>
    <div class="panel">
      <h2>كل الأصناف</h2>
      <div class="scroll"><table id="menuTable"></table></div>
    </div>
  </section>
</main>

<div class="modal" id="receiptModal" role="dialog" aria-modal="true" aria-label="الفاتورة" hidden>
  <div class="modal-box">
    <div id="receiptBody"></div>
    <div class="actions">
      <button class="btn" id="closeReceipt">إغلاق</button>
      <button class="btn primary" id="printReceipt">طباعة</button>
    </div>
  </div>
</div>
<div id="printArea"></div>
<div id="toast" hidden></div>

<script>
(function(){
  var PAY = {cash:'نقدي', card:'فيزا', wallet:'محفظة إلكترونية'};

  var S = {settings:{name:'',address:'',phone:'',tax:0,service:0,nextNo:0}, menu:[], orders:[], entries:[]};
  var rev = -1, curTab = 'pos';
  var cart = [], curCat = 'الكل', query = '', pending = null, lastReceipt = null;

  function $(s){return document.querySelector(s)}
  function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  function r2(n){return Math.round((n+Number.EPSILON)*100)/100}
  function fmt(n){return '<span class="num">'+fmtT(n)+'</span>'}
  function fmtT(n){return r2(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
  function fmtDate(d){var x=new Date(d);return x.toLocaleDateString('en-GB')+' '+x.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}
  var toastTimer;
  function toast(msg){var t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.hidden=true},3000)}

  /* ---------- الاتصال بالسيرفر ---------- */
  function setStatus(ok){
    var s = $('#status');
    s.textContent = ok ? 'متصل بالسيرفر' : 'مفيش اتصال بالسيرفر';
    s.className = 'status ' + (ok ? 'on' : 'off');
  }
  async function api(method, url, body){
    var res;
    try{
      res = await fetch(url, {method:method, headers: body ? {'Content-Type':'application/json'} : {}, body: body ? JSON.stringify(body) : undefined});
    }catch(e){ setStatus(false); throw new Error('مفيش اتصال بالسيرفر، جرّب تاني'); }
    var data = null;
    try{ data = await res.json(); }catch(e){}
    setStatus(true);
    if(!res.ok) throw new Error((data && data.error) || 'حصل خطأ في السيرفر');
    return data;
  }
  async function refresh(force){
    var d;
    try{ d = await api('GET','/api/data'); }catch(e){ return; }
    if(!force && d.rev === rev) return;
    var first = (rev === -1);
    rev = d.rev; S.settings = d.settings; S.menu = d.menu; S.orders = d.orders; S.entries = d.entries;
    cart = cart.filter(function(l){ return S.menu.some(function(m){return m.id===l.id}); });
    cart.forEach(function(l){ var m = S.menu.filter(function(x){return x.id===l.id})[0]; l.price = m.price; l.name = m.name; });
    renderAll();
    if(first) fillSettings();
  }

  /* ---------- الحسابات (معاينة فقط، السيرفر هو اللي بيحسب الفاتورة النهائية) ---------- */
  function calc(){
    var sub = r2(cart.reduce(function(a,l){return a+l.price*l.qty},0));
    var dv = Math.max(0, parseFloat($('#discVal').value)||0);
    var disc = $('#discType').value==='pct' ? r2(sub*Math.min(dv,100)/100) : r2(Math.min(dv,sub));
    var base = r2(sub-disc);
    var svc = r2(base*(S.settings.service||0)/100);
    var tax = r2((base+svc)*(S.settings.tax||0)/100);
    return {sub:sub, disc:disc, svc:svc, tax:tax, total:r2(base+svc+tax)};
  }

  /* ---------- الكاشير ---------- */
  function renderBrand(){ $('#brandName').textContent = S.settings.name || 'نظام المطعم'; document.title = (S.settings.name||'نظام المطعم')+' - كاشير وفواتير'; }
  function renderNo(){ $('#nextNo').textContent = S.settings.nextNo; }
  function cats(){ var seen={}, out=[]; S.menu.forEach(function(m){if(!seen[m.cat]){seen[m.cat]=1;out.push(m.cat)}}); return out; }
  function renderChips(){
    var all = ['الكل'].concat(cats());
    if(all.indexOf(curCat)<0) curCat='الكل';
    $('#chips').innerHTML = all.map(function(c){
      return '<button class="chip" data-act="cat" data-cat="'+esc(c)+'" aria-pressed="'+(c===curCat)+'">'+esc(c)+'</button>';
    }).join('');
    $('#cats').innerHTML = cats().map(function(c){return '<option value="'+esc(c)+'">'}).join('');
  }
  function renderMenu(){
    var q = query.trim().toLowerCase();
    var items = S.menu.filter(function(m){
      return (curCat==='الكل'||m.cat===curCat) && (!q || m.name.toLowerCase().indexOf(q)>=0);
    });
    $('#menuGrid').innerHTML = items.length ? items.map(function(m){
      return '<button class="dish" data-act="add" data-id="'+m.id+'"><b>'+esc(m.name)+'</b><div><small>'+esc(m.cat)+'</small><br><span>'+fmt(m.price)+' ج.م</span></div></button>';
    }).join('') : '<p class="empty">'+(rev===-1?'جاري التحميل من السيرفر...':'مفيش أصناف مطابقة. جرّب تصنيف تاني أو أضف صنف من تبويب الأصناف.')+'</p>';
  }
  function renderLines(){
    $('#lines').innerHTML = cart.length ? cart.map(function(l){
      return '<li class="line"><div>'+esc(l.name)+'<small>'+fmt(l.price)+'</small></div>'+
        '<div class="qty"><button data-act="dec" data-id="'+l.id+'" aria-label="تقليل">−</button><span class="num">'+l.qty+'</span><button data-act="inc" data-id="'+l.id+'" aria-label="زيادة">+</button></div>'+
        '<div class="ln-total">'+fmt(l.price*l.qty)+'</div></li>';
    }).join('') : '<li class="empty">اضغط على صنف من القائمة لإضافته للفاتورة.</li>';
  }
  function renderTotals(){
    var c = calc(), s = S.settings;
    var h = '<div class="r"><span>الإجمالي الفرعي</span>'+fmt(c.sub)+'</div>';
    if(c.disc>0) h += '<div class="r"><span>الخصم</span><span>- '+fmt(c.disc)+'</span></div>';
    if(s.service>0) h += '<div class="r"><span>خدمة '+s.service+'%</span>'+fmt(c.svc)+'</div>';
    if(s.tax>0) h += '<div class="r"><span>ضريبة '+s.tax+'%</span>'+fmt(c.tax)+'</div>';
    h += '<div class="grand"><span>الإجمالي</span><strong>'+fmtT(c.total)+' <small>ج.م</small></strong></div>';
    $('#sum').innerHTML = h;
  }
  function renderAll(){
    renderBrand(); renderNo(); renderChips(); renderMenu(); renderLines(); renderTotals();
    if(curTab==='ledger') renderLedger();
    if(curTab==='menu') renderMenuTable();
  }
  function addToCart(id){
    var m = S.menu.filter(function(x){return x.id==id})[0]; if(!m) return;
    var l = cart.filter(function(x){return x.id==id})[0];
    if(l) l.qty++; else cart.push({id:m.id,name:m.name,price:m.price,qty:1});
    renderLines(); renderTotals();
  }
  function changeQty(id,d){
    var l = cart.filter(function(x){return x.id==id})[0]; if(!l) return;
    l.qty += d;
    if(l.qty<=0) cart = cart.filter(function(x){return x.id!=id});
    renderLines(); renderTotals();
  }

  /* ---------- الفاتورة ---------- */
  function receiptHTML(o){
    var h = '<div class="rcpt"><h2>'+esc(o.shop.name)+'</h2>';
    if(o.shop.address) h += '<p class="c">'+esc(o.shop.address)+'</p>';
    if(o.shop.phone) h += '<p class="c">ت: <span class="num">'+esc(o.shop.phone)+'</span></p>';
    h += '<hr><div class="m"><span>فاتورة رقم <span class="num">'+o.no+'</span></span><span class="num">'+fmtDate(o.date)+'</span></div>';
    if(o.table) h += '<div>طاولة: '+esc(o.table)+'</div>';
    h += '<div>الدفع: '+esc(PAY[o.pay]||o.pay)+'</div><hr>';
    h += '<table><thead><tr><th>الصنف</th><th>كمية</th><th>سعر</th><th>إجمالي</th></tr></thead><tbody>';
    o.items.forEach(function(i){
      h += '<tr><td>'+esc(i.name)+'</td><td class="num">'+i.qty+'</td><td class="num">'+fmtT(i.price)+'</td><td class="num">'+fmtT(i.price*i.qty)+'</td></tr>';
    });
    h += '</tbody></table><hr>';
    h += '<div class="t"><span>الإجمالي الفرعي</span><span class="num">'+fmtT(o.subtotal)+'</span></div>';
    if(o.discount>0) h += '<div class="t"><span>الخصم</span><span class="num">- '+fmtT(o.discount)+'</span></div>';
    if(o.service>0) h += '<div class="t"><span>رسوم الخدمة</span><span class="num">'+fmtT(o.service)+'</span></div>';
    if(o.tax>0) h += '<div class="t"><span>الضريبة</span><span class="num">'+fmtT(o.tax)+'</span></div>';
    h += '<hr><div class="t g"><span>الإجمالي</span><span class="num">'+fmtT(o.total)+' ج.م</span></div><hr>';
    h += '<p class="c">شكراً لزيارتكم</p></div>';
    return h;
  }
  function showReceipt(o){
    lastReceipt = o;
    $('#receiptBody').innerHTML = receiptHTML(o);
    $('#receiptModal').hidden = false;
    $('#printReceipt').focus();
  }
  function closeReceipt(){ $('#receiptModal').hidden = true; }
  function doPrint(html){
    $('#printArea').innerHTML = html;
    try{ window.print(); }
    catch(e){ toast('تعذّرت الطباعة من المتصفح ده'); }
  }

  async function checkout(){
    if(!cart.length){ toast('الفاتورة فاضية، أضف صنف الأول'); return; }
    var btn = $('#checkout'); btn.disabled = true;
    try{
      var o = await api('POST','/api/orders',{
        table: $('#table').value.trim(), pay: $('#pay').value,
        items: cart.map(function(l){return {id:l.id, qty:l.qty}}),
        discType: $('#discType').value, discValue: parseFloat($('#discVal').value)||0
      });
      cart = []; $('#discVal').value=''; $('#table').value='';
      await refresh(true);
      showReceipt(o);
    }catch(e){ toast(e.message); }
    finally{ btn.disabled = false; }
  }

  /* ---------- الداخل والخارج ---------- */
  function inPeriod(d,p){
    var now = new Date(), x = new Date(d);
    if(p==='today') return x.toDateString()===now.toDateString();
    if(p==='week') return now-x < 7*864e5;
    if(p==='month') return x.getMonth()===now.getMonth() && x.getFullYear()===now.getFullYear();
    return true;
  }
  function ledgerRows(){
    var p = $('#period').value;
    var rows = S.orders.map(function(o){
      return {kind:'order', key:o.no, date:o.date, type:'in', desc:'فاتورة #'+o.no+(o.table?' - طاولة '+o.table:'')+' ('+(PAY[o.pay]||'')+')', amount:o.total};
    }).concat(S.entries.map(function(e){
      return {kind:'entry', key:e.id, date:e.date, type:e.type, desc:e.desc, amount:e.amount};
    }));
    return rows.filter(function(r){return inPeriod(r.date,p)}).sort(function(a,b){return new Date(b.date)-new Date(a.date)});
  }
  function totalsOf(rows){
    var i=0,o=0; rows.forEach(function(r){ if(r.type==='in') i+=r.amount; else o+=r.amount; });
    return {inn:r2(i), out:r2(o), net:r2(i-o)};
  }
  function renderLedger(){
    var rows = ledgerRows(), t = totalsOf(rows);
    $('#strip').innerHTML =
      '<div><small>إجمالي الداخل</small><b class="in-c">'+fmtT(t.inn)+'</b></div>'+
      '<div><small>إجمالي الخارج</small><b class="out-c">'+fmtT(t.out)+'</b></div>'+
      '<div><small>الصافي</small><b class="'+(t.net>=0?'in-c':'out-c')+'">'+fmtT(t.net)+'</b></div>';
    var h = '<thead><tr><th>التاريخ</th><th>النوع</th><th>البيان</th><th>المبلغ</th><th></th></tr></thead><tbody>';
    if(!rows.length) h += '<tr><td colspan="5" class="empty">مفيش حركات في الفترة دي.</td></tr>';
    rows.forEach(function(r){
      var isIn = r.type==='in';
      var act = r.kind==='order'
        ? '<button class="btn sm" data-act="viewOrder" data-no="'+r.key+'">عرض الفاتورة</button>'
        : '<button class="btn sm danger" data-act="delEntry" data-id="'+r.key+'">'+(pending==='e'+r.key?'تأكيد الحذف؟':'حذف')+'</button>';
      h += '<tr><td class="num">'+fmtDate(r.date)+'</td><td><span class="badge '+(isIn?'in-c':'out-c')+'">'+(isIn?'داخل':'خارج')+'</span></td><td>'+esc(r.desc)+'</td><td class="'+(isIn?'in-c':'out-c')+'"><b>'+fmt(r.amount)+'</b></td><td>'+act+'</td></tr>';
    });
    $('#ledgerTable').innerHTML = h + '</tbody>';
  }
  async function addEntry(){
    var desc = $('#eDesc').value.trim(), amt = parseFloat($('#eAmt').value);
    if(!desc || !(amt>0)){ toast('اكتب البيان والمبلغ (أكبر من صفر)'); return; }
    try{
      await api('POST','/api/entries',{type:$('#eType').value, desc:desc, amount:amt});
      $('#eDesc').value=''; $('#eAmt').value='';
      await refresh(true); toast('تمت الإضافة');
    }catch(e){ toast(e.message); }
  }
  function printReport(){
    var rows = ledgerRows(), t = totalsOf(rows);
    var label = $('#period').options[$('#period').selectedIndex].text;
    var h = '<div class="rpt"><h2>'+esc(S.settings.name)+' - تقرير الداخل والخارج</h2><p>الفترة: '+esc(label)+' | تاريخ الطباعة: <span class="num">'+fmtDate(new Date())+'</span></p>';
    h += '<p>إجمالي الداخل: <b class="num">'+fmtT(t.inn)+'</b> &nbsp; إجمالي الخارج: <b class="num">'+fmtT(t.out)+'</b> &nbsp; الصافي: <b class="num">'+fmtT(t.net)+'</b></p>';
    h += '<table><thead><tr><th>التاريخ</th><th>النوع</th><th>البيان</th><th>المبلغ</th></tr></thead><tbody>';
    rows.forEach(function(r){ h += '<tr><td class="num">'+fmtDate(r.date)+'</td><td>'+(r.type==='in'?'داخل':'خارج')+'</td><td>'+esc(r.desc)+'</td><td class="num">'+fmtT(r.amount)+'</td></tr>'; });
    doPrint(h+'</tbody></table></div>');
  }

  /* ---------- الأصناف والإعدادات ---------- */
  function fillSettings(){
    var s = S.settings;
    $('#sName').value=s.name; $('#sAddr').value=s.address; $('#sPhone').value=s.phone; $('#sTax').value=s.tax; $('#sSvc').value=s.service;
  }
  function renderMenuTable(){
    var h = '<thead><tr><th>الصنف</th><th>التصنيف</th><th>السعر</th><th></th></tr></thead><tbody>';
    S.menu.forEach(function(m){
      h += '<tr><td>'+esc(m.name)+'</td><td>'+esc(m.cat)+'</td><td>'+fmt(m.price)+'</td><td><button class="btn sm danger" data-act="delDish" data-id="'+m.id+'">'+(pending==='d'+m.id?'تأكيد الحذف؟':'حذف')+'</button></td></tr>';
    });
    $('#menuTable').innerHTML = h + '</tbody>';
  }
  async function addDish(){
    var n = $('#mName').value.trim(), c = $('#mCat').value.trim()||'أخرى', p = parseFloat($('#mPrice').value);
    if(!n || isNaN(p) || p<0){ toast('اكتب اسم الصنف وسعره'); return; }
    try{
      await api('POST','/api/menu',{name:n, cat:c, price:p});
      $('#mName').value=''; $('#mPrice').value='';
      await refresh(true); toast('تمت إضافة الصنف');
    }catch(e){ toast(e.message); }
  }
  async function saveSettings(){
    try{
      await api('PUT','/api/settings',{
        name:$('#sName').value, address:$('#sAddr').value, phone:$('#sPhone').value,
        tax:parseFloat($('#sTax').value)||0, service:parseFloat($('#sSvc').value)||0
      });
      await refresh(true); fillSettings(); toast('تم حفظ الإعدادات');
    }catch(e){ toast(e.message); }
  }

  /* ---------- الأحداث ---------- */
  function showTab(name){
    curTab = name;
    ['pos','ledger','menu'].forEach(function(t){ $('#tab-'+t).hidden = (t!==name); });
    document.querySelectorAll('.tabs button').forEach(function(b){ b.setAttribute('aria-selected', String(b.dataset.tab===name)); });
    if(name==='ledger') renderLedger();
    if(name==='menu'){ fillSettings(); renderMenuTable(); }
    refresh(true);
  }
  document.addEventListener('click', async function(e){
    var tab = e.target.closest('[data-tab]'); if(tab){ showTab(tab.dataset.tab); return; }
    var el = e.target.closest('[data-act]'); if(!el) return;
    var a = el.dataset.act, id = el.dataset.id;
    if(a==='cat'){ curCat = el.dataset.cat; renderChips(); renderMenu(); }
    else if(a==='add') addToCart(+id);
    else if(a==='inc') changeQty(+id,1);
    else if(a==='dec') changeQty(+id,-1);
    else if(a==='viewOrder'){ var o = S.orders.filter(function(x){return x.no==el.dataset.no})[0]; if(o) showReceipt(o); }
    else if(a==='delEntry'){
      if(pending==='e'+id){
        pending = null;
        try{ await api('DELETE','/api/entries/'+id); await refresh(true); }catch(err){ toast(err.message); renderLedger(); }
      } else { pending='e'+id; renderLedger(); }
    }
    else if(a==='delDish'){
      if(pending==='d'+id){
        pending = null;
        try{ await api('DELETE','/api/menu/'+id); await refresh(true); }catch(err){ toast(err.message); renderMenuTable(); }
      } else { pending='d'+id; renderMenuTable(); }
    }
  });
  $('#search').addEventListener('input', function(e){ query = e.target.value; renderMenu(); });
  $('#discVal').addEventListener('input', renderTotals);
  $('#discType').addEventListener('change', renderTotals);
  $('#clearCart').addEventListener('click', function(){ cart=[]; $('#discVal').value=''; renderLines(); renderTotals(); });
  $('#checkout').addEventListener('click', checkout);
  $('#closeReceipt').addEventListener('click', closeReceipt);
  $('#printReceipt').addEventListener('click', function(){ if(lastReceipt) doPrint(receiptHTML(lastReceipt)); });
  $('#receiptModal').addEventListener('click', function(e){ if(e.target.id==='receiptModal') closeReceipt(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeReceipt(); });
  $('#period').addEventListener('change', renderLedger);
  $('#addEntry').addEventListener('click', addEntry);
  $('#printReport').addEventListener('click', printReport);
  $('#addDish').addEventListener('click', addDish);
  $('#saveSettings').addEventListener('click', saveSettings);

  renderAll();
  refresh(true);
  setInterval(function(){ if(!document.hidden) refresh(false); }, 8000);
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) refresh(false); });
})();
</script>
</body>
</html>
